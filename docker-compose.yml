services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recall
      POSTGRES_PASSWORD: recall
      POSTGRES_DB: recall
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recall -d recall"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "8081:${APP_PORT:-8081}"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://recall:recall@postgres:5432/recall?sslmode=disable
      STORAGE_ROOT: /app/storage
    volumes:
      - /mnt/vyuha/ReCall:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
